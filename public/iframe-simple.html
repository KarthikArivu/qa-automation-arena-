<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iFrame Simple Target</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827;
      color: #F3F4F6;
      padding: 16px;
      margin: 0;
      border: 2px dashed #00F5D4;
      border-radius: 8px;
    }
    input, button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 2px solid #000;
      font-weight: bold;
    }
    input {
      background: #1F2937;
      color: #fff;
      border-color: #374151;
      margin-right: 8px;
    }
    button {
      background: #00F5D4;
      color: #000;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      background: #1e293b;
      border-radius: 6px;
      font-family: monospace;
      color: #FEE440;
    }
  </style>
</head>
<body>
  <div data-testid="simple-iframe-wrapper">
    <h3 style="margin-top:0; color:#00F5D4;">👾 Inside The Simple iFrame (Level 1)</h3>
    <p>Target selector: <code>page.frameLocator('iframe#simple-frame')</code></p>
    <div style="display:flex; align-items:center; gap:8px;">
      <input type="text" id="iframe-input" data-testid="iframe-secret-input" placeholder="Type secret password..." />
      <button id="iframe-submit-btn" data-testid="iframe-submit-btn" onclick="submitSecret()">Send to Host</button>
    </div>
    <div id="iframe-result" data-testid="iframe-result-msg" class="status">Awaiting input...</div>
  </div>

  <script>
    function submitSecret() {
      const val = document.getElementById('iframe-input').value;
      const res = document.getElementById('iframe-result');
      if (val.trim()) {
        res.innerText = `Verified! Secret unlocked: "${val}" (No Cap)`;
        res.style.color = '#00F5D4';
      } else {
        res.innerText = `Bro typed nothing fr fr!`;
        res.style.color = '#FF4365';
      }
    }
  </script>
</body>
</html>
