<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outer iFrame</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      margin: 0;
      border: 2px solid #FF4365;
      border-radius: 8px;
    }
    iframe {
      width: 100%;
      height: 180px;
      border: 2px dashed #FEE440;
      border-radius: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div data-testid="outer-iframe-container">
    <h4 style="margin: 0; color: #FF4365;">📦 Outer Frame (Parent Frame)</h4>
    <p style="margin: 4px 0; font-size: 13px;">Parent Frame Text: <span id="outer-status" data-testid="outer-status-badge">Outer Frame Active</span></p>
    <iframe id="child-nested-frame" name="child-nested-frame" src="/iframe-child.html" data-testid="child-nested-frame"></iframe>
  </div>
</body>
</html>
